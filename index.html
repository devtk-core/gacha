<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="配信で使える簡易ガチャツール。景品と確率を設定して、1回・連続ガチャが可能。インストール不要・無料。" />
  <meta name="robots" content="index,follow" />
  <title>簡易ガチャ</title>
  <style>
    :root { --gap: 12px; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 12px;
      line-height: 1.4;
    }

    textarea, input { width: 100%; box-sizing: border-box; font-size: 16px; }
    textarea { height: 180px; }

    h1 { margin: 0 0 12px; }
    h2 { margin: 18px 0 8px; }

    /* PC: 2カラム / スマホ: 1カラム */
    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
      align-items: start;
    }
    @media (min-width: 720px) {
      .row { grid-template-columns: 1fr 1fr; }
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      background: #fff;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    @media (min-width: 720px) {
      .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .actions.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    button {
      padding: 12px 14px;
      width: 100%;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 10px;
      background: #f7f7f7;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }

    pre {
      background: #f6f6f6;
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
      white-space: pre-wrap;      /* スマホで横スクロールしにくくする */
      word-break: break-word;
      margin: 0;
    }

    .warn { color: #b00020; margin: 8px 0 0; }
    .ok { color: #0a7a0a; margin: 8px 0 0; }

    .help { color: #444; font-size: 14px; margin: 6px 0 0; }
    label { font-weight: 600; display: inline-block; margin-bottom: 6px; }
  </style>
  <meta name="google-site-verification" content="ie-qgVLAg0jEtOq5Kiw7DSFJhuUg5bOFBmEpNvN8EBg" />
</head>

<body>
  <h1>ガチャ（簡易）</h1>

  <h2>1) 景品と確率（重み）を設定</h2>
  <p class="help">1行に1景品： <code>景品名,重み</code>（重みは整数推奨。合計が100でなくてもOK）</p>
  <textarea id="items">A賞（超レア演出）,1
B賞（レア）,5
C賞（ふつう）,20
D賞（参加賞）,74</textarea>

  <div class="row" style="margin-top: 12px;">
    <div class="card">
      <h2 style="margin-top:0;">2) 連続回数</h2>
      <label for="count">N回のN</label>
      <input id="count" type="number" min="1" value="10" />
      <p id="status" class="help"></p>

      <div class="actions three">
        <button id="draw1">1回引く</button>
        <button id="drawN">N回引く</button>
        <button id="clear">結果クリア</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0;">3) 設定チェック</h2>
      <div class="actions two">
        <button id="validate">確率チェック</button>
      </div>
      <div style="margin-top:10px;">
        <pre id="check"></pre>
      </div>
    </div>
  </div>

  <h2>結果</h2>
  <div class="card">
    <pre id="result"></pre>
  </div>

<script>
  function parseItems(text) {
    const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const items = [];
    for (const line of lines) {
      const parts = line.split(",").map(s => s.trim());
      if (parts.length !== 2) throw new Error(`形式エラー: "${line}" は "景品名,重み" で入力してください`);
      const name = parts[0];
      const weight = Number(parts[1]);
      if (!name) throw new Error(`景品名が空です: "${line}"`);
      if (!Number.isFinite(weight) || weight <= 0) throw new Error(`重みが不正です: "${line}"（0より大きい数）`);
      items.push({ name, weight });
    }
    if (items.length === 0) throw new Error("景品が0件です");
    return items;
  }

  function buildPicker(items) {
    const total = items.reduce((a, x) => a + x.weight, 0);
    const cum = [];
    let acc = 0;
    for (const it of items) {
      acc += it.weight;
      cum.push({ upto: acc, name: it.name });
    }
    return () => {
      const r = Math.random() * total;
      for (const c of cum) if (r < c.upto) return c.name;
      return cum[cum.length - 1].name;
    };
  }

  const elItems = document.getElementById("items");
  const elCount = document.getElementById("count");
  const elResult = document.getElementById("result");
  const elCheck = document.getElementById("check");
  const elStatus = document.getElementById("status");

  function validate(showOk=true) {
    try {
      const items = parseItems(elItems.value);
      const total = items.reduce((a, x) => a + x.weight, 0);
      const lines = items.map(x => {
        const pct = (x.weight / total * 100);
        return `${x.name} : 重み ${x.weight} （約 ${pct.toFixed(2)}%）`;
      });
      elCheck.textContent = `合計重み: ${total}\n` + lines.join("\n");
      if (showOk) {
        elStatus.textContent = "設定OK";
        elStatus.className = "ok";
      }
      return { ok: true, items };
    } catch (e) {
      elCheck.textContent = String(e.message || e);
      elStatus.textContent = "設定にエラーあり";
      elStatus.className = "warn";
      return { ok: false, error: e };
    }
  }

  function draw(times) {
    const v = validate(false);
    if (!v.ok) return;

    const pick = buildPicker(v.items);
    const results = [];
    const tally = new Map();

    for (let i = 0; i < times; i++) {
      const r = pick();
      results.push(r);
      tally.set(r, (tally.get(r) || 0) + 1);
    }

    const tallyText = Array.from(tally.entries())
      .sort((a,b) => b[1]-a[1])
      .map(([k,v]) => `${k} : ${v}`)
      .join("\n");

    elResult.textContent =
      `【${times}回】\n` +
      results.map((x, i) => `${String(i+1).padStart(2,"0")} : ${x}`).join("\n") +
      `\n\n--- 集計 ---\n${tallyText}\n\n` +
      elResult.textContent;
  }

  document.getElementById("validate").onclick = () => validate(true);
  document.getElementById("draw1").onclick = () => draw(1);
  document.getElementById("drawN").onclick = () => draw(Math.max(1, Number(elCount.value) || 1));
  document.getElementById("clear").onclick = () => { elResult.textContent = ""; };

  validate(true);
</script>
</body>
</html>
